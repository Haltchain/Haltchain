name: Daily Adversarial Canary

on:
  schedule:
    # 02:00 UTC daily
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  RUST_LOG: "haltchain_api=info"
  CARGO_TERM_COLOR: always

jobs:
  canary:
    name: Adversarial Canary Suite
    runs-on: ubuntu-latest

    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: haltchain_test
          POSTGRES_USER: haltchain
          POSTGRES_PASSWORD: haltchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Apply schema migrations
        env:
          PGPASSWORD: haltchain
        run: |
          for f in \
            migrations/001_decisions_and_feedback.sql \
            migrations/002_compliance_resource_domains.sql \
            migrations/003_adjustment_recommendations.sql \
            migrations/004_capability_trajectory.sql \
            migrations/005_admin_users.sql \
            migrations/006_create_partitions.sql \
            migrations/007_pgvector_embeddings.sql \
            migrations/008_hash_chaining.sql; do
            psql -h localhost -U haltchain -d haltchain_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build -p haltchain-api --release

      - name: Start HaltChain validator
        env:
          DATABASE_URL: postgres://haltchain:haltchain@localhost/haltchain_test
          PORT: 8080
          HALTCHAIN_EMBEDDING_TIER: developer
        run: |
          ./target/release/haltchain-api &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          # Wait for health endpoint
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080/health && break || sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install canary dependencies
        run: |
          pip install httpx
          pip install -e "./sdk/python[crypto]"

      - name: Run adversarial canary suite
        run: python canary/run_canary.py --url http://localhost:8080

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Canary] Adversarial suite regression — ${new Date().toISOString().slice(0,10)}`,
              body: `The daily adversarial canary failed on run [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n\nAt least one adversarial prompt was **allowed through** the policy engine. Immediate review required.`,
              labels: ['bug', 'security', 'canary'],
            });
