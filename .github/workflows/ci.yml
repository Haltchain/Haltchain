name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend build
        working-directory: frontend
        env:
          PORT: "5173"
          BASE_PATH: "/"
        run: npm run build

  #Lint
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  #tests
  test:
    name: Test (stable)
    runs-on: ubuntu-latest
    needs: [lint, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace

      - name: Run unit tests
        run: cargo test --workspace

      - name: Run integration tests
        run: cargo test -p haltchain-rules --test integration

  sdk-contract:
    name: SDK/API Contract Gate
    runs-on: ubuntu-latest
    needs: test
    env:
      HALTCHAIN_ADMIN_KEYS: ${{ secrets.HALTCHAIN_ADMIN_KEYS }},
      
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: haltchain_test
          POSTGRES_USER: haltchain
          POSTGRES_PASSWORD: haltchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply schema migrations
        env:
          PGPASSWORD: haltchain
        run: |
          psql -h localhost -U haltchain -d haltchain_test -f migrations/001_decisions_and_feedback.sql
          psql -h localhost -U haltchain -d haltchain_test -f migrations/002_compliance_resource_domains.sql
      - name: Build API
        run: cargo build -p haltchain-api --release
      - name: Start validator API
        env:
          DATABASE_URL: postgres://haltchain:haltchain@localhost/haltchain_test
          PORT: 8080
        run: |
          ./target/release/haltchain-api &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/health && break || sleep 2
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./sdk/python[dev,crypto]"
      - name: Run SDK/API contract tests
        env:
          HALTCHAIN_CONTRACT_URL: http://localhost:8080
          HALTCHAIN_CONTRACT_API_KEY: dev-key
        run: pytest sdk/python/tests/test_contract.py -v
      - name: Stop validator API
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

  #Benchmark (p99 gate) 
  bench:
    name: Benchmark (configurable p99 gate)
    runs-on: ubuntu-latest
    needs: sdk-contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run benchmark harness
        env:
          HALTCHAIN_BENCH_P99_TARGET_US: "1500"
        run: cargo run -p haltchain-bench --release

  #Security audit 
  audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --quiet

      - name: Audit dependencies
        run: cargo audit
