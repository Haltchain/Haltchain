name: Python SDK CI

on:
  push:
    branches: ["main"]
    paths:
      - "sdk/python/**"
      - ".github/workflows/python-sdk-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "sdk/python/**"
      - ".github/workflows/python-sdk-ci.yml"

jobs:
  test:
    name: SDK tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./sdk/python[dev,crypto]"
      - name: Run SDK tests
        run: pytest sdk/python/tests/
