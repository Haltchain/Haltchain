[package]
name = "haltchain-cache"
version = "0.1.0"
edition = "2024"
description = "Decision and embedding caches for HaltChain"
license = "MIT"
repository = "https://github.com/Haltchain/HaltChain"

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
hex        = { workspace = true }
parking_lot = { workspace = true }
thiserror  = { workspace = true }
tokio      = { workspace = true }
tracing    = { workspace = true }
redis = { version = "1.2.0", features = ["tokio-comp"] }
deadpool-redis = "0.23.0"
