[package]
name = "haltchain-embeddings"
version = "0.1.0"
edition = "2024"
description = "Embedding pipelines, ONNX workers, and hybrid cache"
license = "MIT"
repository = "https://github.com/Haltchain/HaltChain"

[dependencies]
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
sha2        = { workspace = true }
hex         = { workspace = true }
chrono      = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
uuid        = { workspace = true }
reqwest     = { workspace = true }

# ONNX Runtime for semantic embeddings
# TODO: upgrade to ort 2.0 stable once released (currently rc.5).
# Track: https://github.com/pykeio/ort/releases
ort = "2.0.0-rc.5"
ndarray = "0.17"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
dirs = "5"

# Optional Redis L2 embedding cache (shared across instances)
redis = { version = "0.28", optional = true }

[[bin]]
name = "haltchain-model-worker"
path = "src/bin/model_worker_main.rs"

[features]
default = []
coreml = ["ort/coreml"]
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
redis-cache = ["redis"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
