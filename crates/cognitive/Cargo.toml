[package]
name = "haltchain-cognitive"
version = "0.1.0"
edition = "2024"
description = "Cognitive screening, ONNX detection, and semantic monitoring"
license = "MIT"
repository = "https://github.com/Haltchain/HaltChain"

[dependencies]
haltchain-embeddings = { path = "../embeddings" }
parking_lot = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
regex = "1"
lazy_static = "1"
ndarray = "0.15"
async-trait = "0.1"
aho-corasick = "1"
decancer = "3.3.3"
reqwest = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
rand = "0.8"
rand_distr = "0.4"
haltchain-analytics = { path = "../analytics" }
haltchain-embeddings = { path = "../embeddings" }
tokio = { version = "1", features = ["rt", "macros"] }
