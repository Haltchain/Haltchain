[package]
name = "haltchain-mcp-guard"
version = "0.1.0"
edition = "2024"
description = "MCP (Model Context Protocol) enforcement and scanning"
license = "MIT"
repository = "https://github.com/Haltchain/HaltChain"

[[bin]]
name = "haltchain-mcp"
path = "src/bin/haltchain_mcp.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
pgvector = { version = "0.4", features = ["sqlx"] }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
aho-corasick = "1"
clap = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
haltchain-cognitive = { path = "../cognitive" }
haltchain-cache = { path = "../cache" }
haltchain-signing = { path = "../signing" }
haltchain-merkle = { path = "../merkle" }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
ureq = { version = "2", features = ["json"] }
serde_json = { workspace = true }

[[bench]]
name = "mcp_guard_latency"
harness = false
