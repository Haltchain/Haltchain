# fly.toml app configuration file generated for haltchain-consensus on 2026-03-11T10:52:59-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'haltchain-consensus'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  HALTCHAIN_CLUSTER_SIZE = '3'
  HALTCHAIN_NODE_ID = '1'
  HALTCHAIN_PEERS = '2=haltchain-consensus-2.internal:7000,3=haltchain-consensus-3.internal:7000'
  HALTCHAIN_QUORUM = '2'
  RUST_LOG = 'info,haltchain_consensus=debug'

[[mounts]]
  source = 'haltchain_raft_log'
  destination = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 8080

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.http_checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[services]]
  protocol = 'tcp'
  internal_port = 7000

  [[services.ports]]
    port = 7000

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
