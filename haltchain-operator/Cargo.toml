[package]
name = "haltchain-operator"
version = "0.1.0"
edition = "2024"

[lib]
name = "haltchain_operator"
path = "src/lib.rs"

[[bin]]
name = "haltchain-operator"
path = "src/main.rs"

[dependencies]
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror   = { workspace = true }
futures-util = { workspace = true }
axum        = { workspace = true }
reqwest     = { workspace = true }

kube        = { version = "0.96", features = ["runtime", "derive", "client", "admission"] }
kube-runtime = "0.96"
k8s-openapi  = { version = "0.23", features = ["v1_30"] }
schemars     = "0.8"
anyhow       = "1"
json-patch   = "2"
jsonptr      = "0.4"
tower        = "0.4"
chrono       = { workspace = true }
tokio-rustls   = { workspace = true }
hmac         = "0.12"
sha2         = { workspace = true }
hex          = { workspace = true }
rustls         = { workspace = true }
rustls-pemfile = { workspace = true }
hyper          = { workspace = true }
hyper-util     = { workspace = true }

[dev-dependencies]
serde_yaml = "0.9"
kube = { version = "0.96", features = ["runtime", "derive", "client", "admission", "ws"] }
