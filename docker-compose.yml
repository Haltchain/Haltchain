services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: haltchain-frontend:dev
    container_name: haltchain-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env.docker
    environment:
      # These are overridden by .env.docker if present
      HALTCHAIN_API_URL: http://api:8080
      FRONTEND_PORT: 3000

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: haltchain-api:dev
    container_name: haltchain-dev
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # DATABASE_URL comes from .env.docker (Supabase). Do NOT override it here.
      RUST_LOG: info
      # HALTCHAIN_ADMIN_KEYS: defined in .env.docker (DO NOT COMMIT REAL KEYS)
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"ok\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: haltchain-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── PostgREST: RLS-enforced auditor REST API (Phase 1b) ──────────────────────
  # JWT claims are mapped to PG roles: auditor_role → read-only, scoped by org_id.
  # Set PGRST_JWT_SECRET in .env.docker to the same HS256 secret used by the API.

  postgrest:
    image: postgrest/postgrest:v12.2.8
    container_name: haltchain-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    env_file:
      - .env.docker
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: 3000

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres.local
    image: haltchain-postgres-local:pg16
    container_name: haltchain-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron,pg_stat_statements
      - -c
      - cron.database_name=${POSTGRES_DB}
    ports:
      - "5432:5432"
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - haltchain_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 2

volumes:
  haltchain_pgdata:


