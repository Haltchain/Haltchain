apiVersion: v1
kind: Service
metadata:
  name: {{ include "haltchain-operator.webhookServiceName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "haltchain-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "haltchain-operator.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.webhook.servicePort }}
      targetPort: {{ .Values.webhook.port }}
      name: webhook
