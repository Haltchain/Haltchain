apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "haltchain-operator.fullname" . }}-sidecar-injector
  labels:
    {{- include "haltchain-operator.labels" . | nindent 4 }}
webhooks:
  - name: sidecar-injector.haltchain.io
    admissionReviewVersions: [v1]
    clientConfig:
      service:
        name: {{ include "haltchain-operator.webhookServiceName" . }}
        namespace: {{ .Values.namespace.name }}
        path: /mutate-pods
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
        operations: [CREATE, UPDATE]
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    namespaceSelector:
      matchLabels:
        {{- toYaml .Values.webhook.namespaceSelector | nindent 8 }}
    sideEffects: None
    timeoutSeconds: 10
