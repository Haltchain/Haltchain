# HaltChain DragonflyDB Server Configuration
# Phase 1 Hardening — v2026.04-P1
#
# Deploy notes:
#   - Replace <TLS_CERT_PATH> and <TLS_KEY_PATH> with absolute paths to your
#     TLS certificate and private key (PEM format).
#   - Set DRAGONFLY_PASSWORD in the environment and reference it via
#     requirepass / ACL entries.
#   - Bind to 127.0.0.1 for single-host deployments, or to the VPC-internal
#     interface for multi-host (e.g. 10.0.0.0/8).
#
# Security guarantees in this config:
#   1. TLS-only connections (plain-text port disabled).
#   2. FLUSHALL / CONFIG SET / DEBUG / SLAVEOF blocked via ACL.
#   3. Bind to loopback / VPC interface only — no public exposure.
#   4. Authenticated access required (requirepass + ACL).
#   5. Key-space notifications disabled (reduces attack surface).

# ─── Network ──────────────────────────────────────────────────────────────────

# Bind ONLY to localhost (single-host) or VPC-internal IP.
# Change to your VPC interface address for multi-node deployments.
bind 127.0.0.1

# Disable the plain-text port.
port 0

# Enable TLS.
tls-port 6380
tls-cert-file /etc/haltchain/tls/dragonfly.crt
tls-key-file  /etc/haltchain/tls/dragonfly.key

# Require TLS for all connections (including replication).
tls-auth-clients yes

# ─── Authentication ───────────────────────────────────────────────────────────

# Global default password (also used as ACL default-user password).
# In production, set via environment variable: --requirepass "$DRAGONFLY_PASSWORD"
requirepass ""

# Disable the default (unauthenticated) user.
# acl setuser default off

# haltchain-validator: read and set-with-expiry only.
# acl setuser haltchain-validator on >$DRAGONFLY_PASSWORD ~* +GET +SETEX +PING +QUIT

# ─── Dangerous command restrictions ──────────────────────────────────────────

# Block commands that could wipe data, expose config, or enable replication attacks.
rename-command FLUSHALL    ""
rename-command FLUSHDB     ""
rename-command CONFIG      ""
rename-command DEBUG       ""
rename-command SLAVEOF     ""
rename-command REPLICAOF   ""
rename-command BGREWRITEAOF ""
rename-command BGSAVE      ""
rename-command SAVE        ""
rename-command SHUTDOWN    ""

# ─── Memory & eviction ───────────────────────────────────────────────────────

# Maximum memory before eviction kicks in (adjust for your host).
maxmemory 2gb

# Evict least-recently-used keys from all key-spaces.
maxmemory-policy allkeys-lru

# ─── Persistence ─────────────────────────────────────────────────────────────

# For a pure cache use-case, disable RDB snapshots and AOF.
# Re-enable if durability is required.
save ""
appendonly no

# ─── Key-space notifications ─────────────────────────────────────────────────

# Disabled: reduces attack surface and CPU overhead.
notify-keyspace-events ""

# ─── Logging ─────────────────────────────────────────────────────────────────

loglevel notice
logfile /var/log/dragonfly/dragonfly.log

# ─── Timeouts ────────────────────────────────────────────────────────────────

# Close idle client connections after 300 seconds.
timeout 300

# TCP keepalive interval (seconds).
tcp-keepalive 60
