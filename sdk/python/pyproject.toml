[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "haltchain"
version     = "0.4.0"
description = "Python SDK for HaltChain — the AI agent safety layer"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.9,<3.15"
keywords    = ["ai", "safety", "agent", "llm", "policy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
http2 = ["httpx[http2]>=0.27"]
langchain = ["langchain-core>=0.2"]
langgraph = ["langgraph>=0.2"]
crewai = ["crewai>=0.80"]
openclaw = []
redis = ["redis>=5.0"]
crypto = ["cryptography>=42.0"]
all = ["langgraph>=0.2", "crewai>=0.80", "langchain-core>=0.2"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "notebook>=7",
    "ipykernel",
    "cryptography>=42.0",
]

[project.urls]
Homepage      = "https://github.com/Haltchain/HaltChain"
Repository    = "https://github.com/Haltchain/Haltchain"
Documentation = "https://haltchain-consensus.fly.dev"
"Bug Tracker" = "https://github.com/Haltchain/Haltchain/issues"

[tool.hatch.build.targets.wheel]
packages = ["haltchain"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
